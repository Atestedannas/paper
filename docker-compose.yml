version: '3.8'

services:
  # 1. Go 主控服务
  go-app:
    build: 
      context: .
      dockerfile: Dockerfile
    ports:
      - "8002:8002"
    environment:
      - DATABASE_HOST=postgres
      - DATABASE_PORT=5432
      - DATABASE_USER=postgres
      - DATABASE_PASSWORD=postgres
      - DATABASE_NAME=paper_db
      - REDIS_ADDR=redis:6379
      - OPENXML_VALIDATOR_BIN=/app/openxml-validator
      - OPENXML_VALIDATOR_REQUIRED=true
      # Python 服务地址 (使用服务名)
      - PYTHON_SERVICE_URL=http://python-ocr:8000
    depends_on:
      - postgres
      - redis
      - python-ocr
      - python-ocr-worker
    networks:
      - backend-network

  # 2. Python 视觉/OCR 辅助服务
  python-ocr:
    build: ../python ocr
    container_name: paper-python-ocr
    expose:
      - "8000"
    environment:
      - REDIS_URL=redis://redis:6379/1
      - UPLOAD_ROOT=/data/uploads
      - OFFICECLI_BIN=officecli
      - APP_HOST=0.0.0.0
      - APP_PORT=8000
      - LOG_DIR=/data/logs
    volumes:
      - ./uploads:/data/uploads
      - ./python-ocr-logs:/data/logs
    networks:
      - backend-network
    depends_on:
      - redis

  # Python RQ worker：消费 visual-checks 队列，执行 OfficeCLI、OCR 和布局识别
  python-ocr-worker:
    build: ../python ocr
    container_name: paper-python-ocr-worker
    command: rq worker visual-checks --url redis://redis:6379/1
    environment:
      - REDIS_URL=redis://redis:6379/1
      - UPLOAD_ROOT=/data/uploads
      - OFFICECLI_BIN=officecli
      - LOG_DIR=/data/logs
    volumes:
      - ./uploads:/data/uploads
      - ./python-ocr-logs:/data/logs
    networks:
      - backend-network
    depends_on:
      - redis

  # 3. PostgreSQL 数据库
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: paper_db
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database_init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - backend-network

  # 4. Redis 缓存
  redis:
    image: redis:7-alpine
    expose:
      - "6379"
    networks:
      - backend-network

networks:
  backend-network:
    driver: bridge

volumes:
  pgdata:
